<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search</title>
<style>
  /* Base styles */
  :root {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #1e90ff;
    --button-bg: var(--accent-color);
    --button-hover-bg: #187bcd;
  }

  body {
    margin: 0;
    padding: 4rem 2rem;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background-color 0.8s ease, color 0.8s ease;
  }

  h1 {
    font-size: 3.5rem;
    margin-bottom: 2rem;
    color: var(--accent-color);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    user-select: none;
  }

  #status {
    font-size: 1.3rem;
    margin-bottom: 3rem;
    font-weight: 500;
    font-style: italic;
    max-width: 360px;
    text-align: center;
    color: var(--text-color);
  }

  button#startBtn {
    background-color: var(--button-bg);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 1rem 3rem;
    cursor: pointer;
    box-shadow: 0 0 15px var(--accent-color);
    user-select: none;
    transition: background-color 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
  }

  button#startBtn:hover {
    background-color: var(--button-hover-bg);
    box-shadow: 0 0 25px var(--accent-color);
  }

  button#startBtn:active {
    transform: scale(0.95);
  }

  /* Responsive */
  @media (max-width: 480px) {
    h1 {
      font-size: 2.5rem;
    }

    button#startBtn {
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>
  <h1>Voice Search</h1>
  <div id="status">Press &amp; hold the button to speak</div>
  <button id="startBtn" aria-pressed="false" aria-label="Press and hold to speak">Hold to Speak</button>

<script>
  // Professional color palettes (background, text, accent)
  const palettes = [
    { bg: '#1f2937', text: '#f9fafb', accent: '#3b82f6' }, // cool blue slate
    { bg: '#111827', text: '#e0e7ff', accent: '#6366f1' }, // indigo night
    { bg: '#0f172a', text: '#f1f5f9', accent: '#22d3ee' }, // cyan dark
    { bg: '#2d2d34', text: '#f0f0f5', accent: '#f97316' }, // warm orange
    { bg: '#20232a', text: '#61dafb', accent: '#21a179' }, // teal & blue
    { bg: '#121212', text: '#e0e0e0', accent: '#ff6f61' }, // dark coral
    { bg: '#222831', text: '#eeeeee', accent: '#00adb5' }, // dark cyan
  ];

  // Pick a random palette on load
  const palette = palettes[Math.floor(Math.random() * palettes.length)];

  // Apply colors to CSS variables
  document.documentElement.style.setProperty('--bg-color', palette.bg);
  document.documentElement.style.setProperty('--text-color', palette.text);
  document.documentElement.style.setProperty('--accent-color', palette.accent);
  document.documentElement.style.setProperty('--button-bg', palette.accent);
  // Slightly darker button hover color (20% darker)
  function darkenColor(hex, percent) {
    const num = parseInt(hex.replace('#',''),16);
    const amt = Math.round(2.55 * percent);
    let R = (num >> 16) - amt;
    let G = (num >> 8 & 0x00FF) - amt;
    let B = (num & 0x0000FF) - amt;
    R = R < 0 ? 0 : R;
    G = G < 0 ? 0 : G;
    B = B < 0 ? 0 : B;
    return `#${(R.toString(16).padStart(2,'0'))}${(G.toString(16).padStart(2,'0'))}${(B.toString(16).padStart(2,'0'))}`;
  }
  document.documentElement.style.setProperty('--button-hover-bg', darkenColor(palette.accent, 20));

  // Speech recognition setup
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  let recognition;
  let recognizing = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    };

    recognition.onerror = (event) => {
      status.textContent = `Error: ${event.error}`;
      recognizing = false;
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onend = () => {
      recognizing = false;
      status.textContent = 'Press & hold the button to speak';
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      status.textContent = `You said: "${transcript}"`;
      if (transcript.includes('search')) {
        const query = transcript.split('search').pop().trim();
        if (query) {
          const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          window.open(url, '_blank');
        } else {
          status.textContent = 'Say "search" followed by your query.';
        }
      } else {
        status.textContent = 'Say "search" followed by your query.';
      }
    };
  } else {
    status.textContent = 'Sorry, your browser does not support Speech Recognition.';
    startBtn.disabled = true;
  }

  // Button press & hold handlers
  startBtn.addEventListener('mousedown', () => {
    if (!recognizing) recognition.start();
  });

  startBtn.addEventListener('mouseup', () => {
    if (recognizing) recognition.stop();
  });

  startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!recognizing) recognition.start();
  }, { passive: false });

  startBtn.addEventListener('touchend', () => {
    if (recognizing) recognition.stop();
  });
</script>
</body>
</html>
