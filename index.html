<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Search - Pro UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    :root {
      --clr-primary: #4ade80;
      --clr-secondary: #2563eb;
      --clr-bg-light: #f9fafb;
      --clr-bg-dark: #121212;
      --clr-text-light: #1f2937;
      --clr-text-dark: #e5e7eb;
      --transition-speed: 0.35s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--clr-bg-light);
      color: var(--clr-text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    body.dark {
      background-color: var(--clr-bg-dark);
      color: var(--clr-text-dark);
    }

    .container {
      background: linear-gradient(145deg, #ffffff, #e6e9f0);
      border-radius: 24px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      padding: 3.5rem 4rem;
      width: 400px;
      max-width: 90vw;
      text-align: center;
      transition: background var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }

    body.dark .container {
      background: linear-gradient(145deg, #1e1e1e, #292929);
      box-shadow: 0 12px 24px rgba(0,0,0,0.75);
    }

    h1 {
      font-weight: 600;
      font-size: 2.8rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      color: var(--clr-secondary);
      background: linear-gradient(90deg, var(--clr-primary), var(--clr-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: text;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 3rem;
      min-height: 1.5em;
      color: var(--clr-primary);
      font-weight: 500;
      user-select: text;
    }

    button {
      padding: 0.8rem 3rem;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      background: var(--clr-primary);
      color: #fff;
      box-shadow: 0 6px 12px rgba(74, 222, 128, 0.5);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
      outline-offset: 4px;
    }

    button:focus-visible {
      outline: 3px solid var(--clr-secondary);
      outline-offset: 4px;
    }

    button:hover {
      background-color: var(--clr-secondary);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.7);
    }

    /* Smooth ripple effect on button */
    button::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      box-shadow: 0 0 15px 10px rgba(255,255,255,0.3);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    button:active::after {
      opacity: 1;
      transition: opacity 0.1s ease;
    }

    /* Dark mode toggle */

    .toggle-wrapper {
      position: fixed;
      top: 2rem;
      right: 2rem;
      user-select: none;
    }

    .toggle {
      width: 52px;
      height: 28px;
      border-radius: 14px;
      background-color: #ddd;
      position: relative;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    body.dark .toggle {
      background-color: var(--clr-primary);
    }

    .toggle-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #fff;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: left 0.3s ease;
    }

    body.dark .toggle-circle {
      left: 26px;
    }

  </style>
</head>
<body>
  <div class="toggle-wrapper" role="button" tabindex="0" aria-label="Toggle dark mode" id="toggleDarkMode">
    <div class="toggle">
      <div class="toggle-circle"></div>
    </div>
  </div>

  <main class="container" role="main" aria-live="polite" aria-atomic="true">
    <h1>Voice Search</h1>
    <div id="status">Press &amp; hold the button to speak</div>
    <button id="startBtn" aria-pressed="false" aria-label="Activate voice recognition">
      🎤 Hold to Speak
    </button>
  </main>

  <script>
    const toggle = document.getElementById('toggleDarkMode');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
    toggle.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        document.body.classList.toggle('dark');
      }
    });

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');

    // Simulated voice recognition start/stop on hold
    startBtn.addEventListener('mousedown', () => {
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    });

    startBtn.addEventListener('mouseup', () => {
      status.textContent = 'Processing...';
      startBtn.setAttribute('aria-pressed', 'false');
      setTimeout(() => {
        status.textContent = 'Press & hold the button to speak';
      }, 2500);
    });

    startBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    }, {passive: false});

    startBtn.addEventListener('touchend', () => {
      status.textContent = 'Processing...';
      startBtn.setAttribute('aria-pressed', 'false');
      setTimeout(() => {
        status.textContent = 'Press & hold the button to speak';
      }, 2500);
    });
  </script>
</body>
</html>
