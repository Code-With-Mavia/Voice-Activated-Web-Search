<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search</title>
<style>
  /* Reset and base */
  *, *::before, *::after {box-sizing: border-box;}
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f0f1a;
    color: #f0f0f5;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  body.light {
    background: #f5f5f7;
    color: #111;
  }

  h1 {
    font-weight: 900;
    font-size: 3rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
    text-transform: uppercase;
    color: #00ffff;
    text-shadow: 0 0 8px #00ffff;
  }

  #status {
    font-size: 1.25rem;
    margin-bottom: 2rem;
    min-height: 2rem;
    font-weight: 600;
  }

  button#startBtn {
    background: linear-gradient(135deg, #00f0ff, #00a8ff);
    border: none;
    border-radius: 50%;
    width: 130px;
    height: 130px;
    font-size: 1.1rem;
    font-weight: bold;
    color: #0f0f1a;
    cursor: pointer;
    box-shadow:
      0 0 20px #00ffff,
      inset 0 0 40px #00ffff;
    transition: background 0.3s ease, transform 0.15s ease;
    user-select: none;
  }
  button#startBtn:active {
    transform: scale(0.9);
    box-shadow:
      0 0 30px #00ffff,
      inset 0 0 60px #00ffff;
  }

  /* Toggle switch */
  .toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toggle-container label {
    cursor: pointer;
    font-weight: 600;
    user-select: none;
    color: inherit;
  }

  .toggle-switch {
    position: relative;
    width: 50px;
    height: 26px;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    background-color: #888;
    border-radius: 34px;
    top: 0; left: 0; right: 0; bottom: 0;
    transition: background-color 0.4s;
  }

  .slider::before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: transform 0.4s;
  }

  input:checked + .slider {
    background-color: #00f0ff;
    box-shadow: 0 0 8px #00f0ff;
  }

  input:checked + .slider::before {
    transform: translateX(24px);
  }

  /* Responsive */
  @media (max-width: 400px) {
    h1 { font-size: 2rem; }
    button#startBtn { width: 100px; height: 100px; font-size: 1rem; }
  }
</style>
</head>
<body>
  <div class="toggle-container">
    <label for="modeToggle">Dark Mode</label>
    <div class="toggle-switch">
      <input type="checkbox" id="modeToggle" />
      <span class="slider"></span>
    </div>
  </div>

  <h1>Voice Search</h1>
  <div id="status">Press & hold the button to speak</div>
  <button id="startBtn" aria-pressed="false" aria-label="Press and hold to speak">Hold to Speak</button>

<script>
  // Dark/light mode toggle
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.addEventListener('change', () => {
    if (modeToggle.checked) {
      document.body.classList.remove('light');
    } else {
      document.body.classList.add('light');
    }
  });

  // Initialize with dark mode on by default
  document.body.classList.remove('light');

  // Speech recognition setup
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  let recognition;
  let recognizing = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    };

    recognition.onerror = (event) => {
      status.textContent = Error: ${event.error};
      recognizing = false;
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onend = () => {
      recognizing = false;
      status.textContent = 'Press & hold the button to speak';
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      status.textContent = You said: "${transcript}";
      if (transcript.includes('search')) {
        const query = transcript.split('search').pop().trim();
        if (query) {
          const url = https://www.google.com/search?q=${encodeURIComponent(query)};
          window.open(url, '_blank');
        } else {
          status.textContent = 'Say "search" followed by your query.';
        }
      } else {
        status.textContent = 'Say "search" followed by your query.';
      }
    };
  } else {
    status.textContent = 'Sorry, your browser does not support Speech Recognition.';
    startBtn.disabled = true;
  }

  // Button press & hold handlers
  startBtn.addEventListener('mousedown', () => {
    if (!recognizing) recognition.start();
  });

  startBtn.addEventListener('mouseup', () => {
    if (recognizing) recognition.stop();
  });

  startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!recognizing) recognition.start();
  }, {passive: false});

  startBtn.addEventListener('touchend', () => {
    if (recognizing) recognition.stop();
  });
</script>
</body>
</html>
