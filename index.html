<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search</title>
<style>
  :root {
    /* Updated color palette */
    --bg-dark: #121a2b;           /* Dark navy */
    --bg-light: #f5f7fa;          /* Light grayish blue */
    --text-dark: #e0e6f1;         /* Light gray */
    --text-light: #2c3e50;        /* Dark slate */
    --accent: #4a90e2;            /* Soft blue */
    --button-glow: 0 0 20px var(--accent), inset 0 0 30px var(--accent);
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-dark);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: background-color 0.4s ease, color 0.4s ease;
    margin: 0;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  body.light {
    background-color: var(--bg-light);
    color: var(--text-light);
  }

  h1 {
    font-size: 3rem;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 8px var(--accent);
    letter-spacing: 2px;
    margin-bottom: 1rem;
  }

  #status {
    font-size: 1.2rem;
    margin: 1rem 0 2rem 0;
    font-weight: 500;
    text-align: center;
    max-width: 320px;
  }

  button#startBtn {
    background: transparent;
    border: 3px solid var(--accent);
    color: var(--accent);
    border-radius: 50%;
    width: 140px;
    height: 140px;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: var(--button-glow);
    transition: all 0.3s ease;
    user-select: none;
  }

  button#startBtn:active {
    transform: scale(0.95);
    box-shadow: 0 0 40px var(--accent), inset 0 0 40px var(--accent);
  }

  /* Toggle switch styles */
  .toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }

  .toggle-container label {
    font-weight: bold;
    cursor: pointer;
    color: inherit;
  }

  .toggle-switch {
    position: relative;
    width: 50px;
    height: 26px;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    background-color: #888;
    border-radius: 34px;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    transition: background-color 0.4s;
  }

  .slider::before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: transform 0.4s;
  }

  input:checked + .slider {
    background-color: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  input:checked + .slider::before {
    transform: translateX(24px);
  }
</style>
</head>
<body>
  <div class="toggle-container">
    <label for="modeToggle">Dark Mode</label>
    <div class="toggle-switch">
      <input type="checkbox" id="modeToggle" checked />
      <span class="slider"></span>
    </div>
  </div>

  <h1>Voice Search</h1>
  <div id="status">Press &amp; hold the button to speak</div>
  <button id="startBtn" aria-pressed="false" aria-label="Press and hold to speak">Hold to Speak</button>

<script>
  // Dark/light mode toggle
  const modeToggle = document.getElementById('modeToggle');
  const body = document.body;

  // Initialize with dark mode on by default
  if (modeToggle.checked) {
    body.classList.remove('light');
  } else {
    body.classList.add('light');
  }

  modeToggle.addEventListener('change', () => {
    if (modeToggle.checked) {
      body.classList.remove('light');
    } else {
      body.classList.add('light');
    }
  });

  // Speech recognition setup
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  let recognition;
  let recognizing = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    };

    recognition.onerror = (event) => {
      status.textContent = `Error: ${event.error}`;
      recognizing = false;
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onend = () => {
      recognizing = false;
      status.textContent = 'Press & hold the button to speak';
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      status.textContent = `You said: "${transcript}"`;
      if (transcript.includes('search')) {
        const query = transcript.split('search').pop().trim();
        if (query) {
          const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          window.open(url, '_blank');
        } else {
          status.textContent = 'Say "search" followed by your query.';
        }
      } else {
        status.textContent = 'Say "search" followed by your query.';
      }
    };
  } else {
    status.textContent = 'Sorry, your browser does not support Speech Recognition.';
    startBtn.disabled = true;
  }

  // Button press & hold handlers
  startBtn.addEventListener('mousedown', () => {
    if (!recognizing) recognition.start();
  });

  startBtn.addEventListener('mouseup', () => {
    if (recognizing) recognition.stop();
  });

  startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!recognizing) recognition.start();
  }, { passive: false });

  startBtn.addEventListener('touchend', () => {
    if (recognizing) recognition.stop();
  });
</script>
</body>
</html>
