<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search</title>
<style>
  :root {
  --bg-dark: #0d0d20;
  --bg-light: #f2f2f2;
  --text-dark: #f2f2f2;
  --text-light: #1c1c1c;
  --accent: #00ffd5;
  --button-glow: 0 0 20px var(--accent), inset 0 0 30px var(--accent);
}

body {
  background-color: var(--bg-dark);
  color: var(--text-dark);
  transition: background-color 0.4s ease, color 0.4s ease;
}

body.light {
  background-color: var(--bg-light);
  color: var(--text-light);
}

h1 {
  font-size: 3rem;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--accent);
  letter-spacing: 2px;
}

#status {
  font-size: 1.2rem;
  margin: 1rem 0;
  font-weight: 500;
}

button#startBtn {
  background: transparent;
  border: 2px solid var(--accent);
  color: var(--accent);
  border-radius: 50%;
  width: 140px;
  height: 140px;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: var(--button-glow);
  transition: all 0.3s ease;
}

button#startBtn:active {
  transform: scale(0.95);
  box-shadow: 0 0 40px var(--accent), inset 0 0 40px var(--accent);
}

/* Toggle switch styles */
.toggle-container {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.toggle-container label {
  font-weight: bold;
  cursor: pointer;
  color: inherit;
}

.toggle-switch {
  position: relative;
  width: 50px;
  height: 26px;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  background-color: #666;
  border-radius: 34px;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: background-color 0.4s;
}

.slider::before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background-color: #fff;
  border-radius: 50%;
  transition: transform 0.4s;
}

input:checked + .slider {
  background-color: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

input:checked + .slider::before {
  transform: translateX(24px);
}

</style>
</head>
<body>
  <div class="toggle-container">
    <label for="modeToggle">Dark Mode</label>
    <div class="toggle-switch">
      <input type="checkbox" id="modeToggle" />
      <span class="slider"></span>
    </div>
  </div>

  <h1>Voice Search</h1>
  <div id="status">Press & hold the button to speak</div>
  <button id="startBtn" aria-pressed="false" aria-label="Press and hold to speak">Hold to Speak</button>

<script>
  // Dark/light mode toggle
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.addEventListener('change', () => {
    if (modeToggle.checked) {
      document.body.classList.remove('light');
    } else {
      document.body.classList.add('light');
    }
  });

  // Initialize with dark mode on by default
  document.body.classList.remove('light');

  // Speech recognition setup
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  let recognition;
  let recognizing = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    };

    recognition.onerror = (event) => {
      status.textContent = Error: ${event.error};
      recognizing = false;
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onend = () => {
      recognizing = false;
      status.textContent = 'Press & hold the button to speak';
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      status.textContent = You said: "${transcript}";
      if (transcript.includes('search')) {
        const query = transcript.split('search').pop().trim();
        if (query) {
          const url = https://www.google.com/search?q=${encodeURIComponent(query)};
          window.open(url, '_blank');
        } else {
          status.textContent = 'Say "search" followed by your query.';
        }
      } else {
        status.textContent = 'Say "search" followed by your query.';
      }
    };
  } else {
    status.textContent = 'Sorry, your browser does not support Speech Recognition.';
    startBtn.disabled = true;
  }

  // Button press & hold handlers
  startBtn.addEventListener('mousedown', () => {
    if (!recognizing) recognition.start();
  });

  startBtn.addEventListener('mouseup', () => {
    if (recognizing) recognition.stop();
  });

  startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!recognizing) recognition.start();
  }, {passive: false});

  startBtn.addEventListener('touchend', () => {
    if (recognizing) recognition.stop();
  });
</script>
</body>
</html>
