<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Futuristic Voice Search</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap');

  :root {
    --neon-blue: #00f0ff;
    --neon-pink: #ff4cdb;
    --neon-green: #39ff14;
    --bg-light: #e0f7fa;
    --bg-dark: #0a0a13;
    --glass-bg-light: rgba(255, 255, 255, 0.15);
    --glass-bg-dark: rgba(15, 15, 23, 0.65);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Exo 2', sans-serif;
    background: var(--bg-light);
    color: #111;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.5s ease, color 0.5s ease;
  }

  body.dark {
    background: var(--bg-dark);
    color: #eee;
  }

  .container {
    background: var(--glass-bg-light);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 25px;
    border: 2px solid transparent;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    padding: 3rem 4rem;
    max-width: 400px;
    text-align: center;
    position: relative;
    transition: background 0.5s ease, border-color 0.5s ease;
  }

  body.dark .container {
    background: var(--glass-bg-dark);
    border-color: var(--neon-pink);
    box-shadow: 0 0 25px var(--neon-pink);
  }

  h1 {
    font-weight: 700;
    font-size: 3rem;
    margin-bottom: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #status {
    font-size: 1.25rem;
    margin: 1.5rem 0 3rem;
    color: var(--neon-green);
    font-weight: 600;
    text-shadow: 0 0 8px var(--neon-green);
    min-height: 1.5em;
  }

  button {
    background: transparent;
    border: 3px solid var(--neon-blue);
    padding: 0.75rem 2rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--neon-blue);
    cursor: pointer;
    border-radius: 50px;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 15px var(--neon-blue);
    transition: all 0.3s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    background: var(--neon-pink);
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.4s ease;
    border-radius: 50%;
    z-index: -1;
    opacity: 0.7;
  }

  button:hover::before,
  button:focus::before {
    transform: translate(-50%, -50%) scale(1);
  }

  button:hover,
  button:focus {
    color: #111;
    box-shadow: 0 0 30px var(--neon-pink);
    border-color: var(--neon-pink);
    outline: none;
  }

  .toggle-container {
    position: absolute;
    top: 20px;
    right: 20px;
  }

  .toggle-button {
    width: 60px;
    height: 32px;
    border-radius: 50px;
    background: var(--neon-blue);
    box-shadow: 0 0 12px var(--neon-blue);
    cursor: pointer;
    position: relative;
    transition: background 0.5s ease;
  }

  body.dark .toggle-button {
    background: var(--neon-pink);
    box-shadow: 0 0 18px var(--neon-pink);
  }

  .toggle-circle {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 26px;
    height: 26px;
    background: #111;
    border-radius: 50%;
    transition: left 0.4s ease;
    box-shadow: 0 0 6px #111;
  }

  body.dark .toggle-circle {
    left: 31px;
  }

  @media (max-width: 450px) {
    .container {
      padding: 2rem 2rem;
      max-width: 90vw;
    }

    h1 {
      font-size: 2.2rem;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1.5rem;
    }
  }
</style>
</head>
<body>
  <div class="toggle-container" role="button" tabindex="0" aria-label="Toggle dark/light mode" id="modeToggle">
    <div class="toggle-button">
      <div class="toggle-circle"></div>
    </div>
  </div>

  <div class="container" role="main">
    <h1>Voice Search</h1>
    <div id="status" aria-live="polite">Press the button and speak</div>
    <button id="startBtn" aria-pressed="false" aria-label="Start voice recognition">Start Listening</button>
  </div>

<script>
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });
  modeToggle.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      document.body.classList.toggle('dark');
    }
  });

  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  startBtn.addEventListener('click', () => {
    statusEl.textContent = "Listening... (Demo mode)";
    startBtn.setAttribute('aria-pressed', 'true');
  });
</script>
</body>
</html>
