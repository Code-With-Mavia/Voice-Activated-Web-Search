<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  :root {
    --bg-light: #0f0f1a;
    --text-light: #00fff7;
    --bg-dark: #121212;
    --text-dark: #00fff7;
    --neon-blue: #00fff7;
    --neon-pink: #ff00d4;
    --neon-green: #39ff14;
  }

  body {
    margin: 0;
    font-family: 'Orbitron', monospace;
    background-color: var(--bg-light);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    transition: background-color 0.5s ease, color 0.5s ease;
  }

  .container {
    border: 2px solid var(--neon-blue);
    padding: 2rem 3rem;
    border-radius: 15px;
    box-shadow:
      0 0 10px var(--neon-blue),
      0 0 40px var(--neon-blue),
      inset 0 0 10px var(--neon-blue);
    text-align: center;
    max-width: 400px;
  }

  h1 {
    font-weight: 500;
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-shadow: 0 0 10px var(--neon-pink);
  }

  #status {
    font-size: 1.2rem;
    margin: 1rem 0 2rem;
    color: var(--neon-green);
    text-shadow: 0 0 8px var(--neon-green);
  }

  button {
    background: none;
    border: 2px solid var(--neon-pink);
    color: var(--neon-pink);
    padding: 0.7rem 1.8rem;
    font-size: 1.1rem;
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow:
      0 0 5px var(--neon-pink),
      0 0 20px var(--neon-pink);
    transition: all 0.3s ease;
  }

  button:hover {
    background-color: var(--neon-pink);
    color: #121212;
    box-shadow:
      0 0 15px var(--neon-pink),
      0 0 40px var(--neon-pink);
  }

  .toggle-container {
    position: absolute;
    top: 20px;
    right: 20px;
  }

  .toggle-button {
    background: none;
    border: 2px solid var(--neon-blue);
    border-radius: 20px;
    width: 60px;
    height: 30px;
    position: relative;
    cursor: pointer;
    box-shadow:
      0 0 10px var(--neon-blue),
      inset 0 0 10px var(--neon-blue);
  }

  .toggle-circle {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    background-color: var(--neon-blue);
    border-radius: 50%;
    transition: left 0.3s ease;
  }

  body.dark {
    background-color: var(--bg-dark);
    color: var(--text-dark);
  }

  body.dark .container {
    border-color: var(--neon-pink);
    box-shadow:
      0 0 10px var(--neon-pink),
      0 0 40px var(--neon-pink),
      inset 0 0 10px var(--neon-pink);
  }

  body.dark h1 {
    text-shadow: 0 0 10px var(--neon-blue);
  }

  body.dark #status {
    color: var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink);
  }

  body.dark button {
    border-color: var(--neon-blue);
    color: var(--neon-blue);
    box-shadow:
      0 0 5px var(--neon-blue),
      0 0 20px var(--neon-blue);
  }

  body.dark button:hover {
    background-color: var(--neon-blue);
    color: var(--bg-dark);
    box-shadow:
      0 0 15px var(--neon-blue),
      0 0 40px var(--neon-blue);
  }

  body.dark .toggle-button {
    border-color: var(--neon-pink);
    box-shadow:
      0 0 10px var(--neon-pink),
      inset 0 0 10px var(--neon-pink);
  }

  body.dark .toggle-circle {
    left: 33px;
    background-color: var(--neon-pink);
  }
</style>
</head>
<body>
  <div class="toggle-container">
    <div class="toggle-button" id="modeToggle" aria-label="Toggle dark/light mode" role="button" tabindex="0">
      <div class="toggle-circle"></div>
    </div>
  </div>
  <div class="container">
    <h1>Voice Search</h1>
    <div id="status">Press the button and speak</div>
    <button id="startBtn">Start Listening</button>
  </div>

<script>
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });
  modeToggle.addEventListener('keypress', (e) => {
    if(e.key === 'Enter' || e.key === ' ') {
      document.body.classList.toggle('dark');
    }
  });

  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  // Placeholder for integration with speech recognition
  startBtn.addEventListener('click', () => {
    statusEl.textContent = "Listening... (This is a demo interface)";
  });
</script>
</body>
</html>
