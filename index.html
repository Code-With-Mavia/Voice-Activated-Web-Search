<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Voice Assistant</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0f0f1b;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
    }

    .glow {
      box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc66;
      transition: all 0.2s ease-in-out;
    }

    .terminal-box {
      border: 2px solid #00ffcc;
      border-radius: 12px;
      background-color: #0f0f1b;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      min-height: 250px;
    }

    .mic-btn {
      border: 2px solid #00ffcc;
      border-radius: 50%;
      height: 80px;
      width: 80px;
      background-color: transparent;
      color: #00ffcc;
      font-size: 32px;
    }

    .mic-btn:hover {
      background-color: #00ffcc11;
    }

    .typing::after {
      content: '|';
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="text-center">
    <h1 class="text-3xl md:text-5xl font-bold mb-8 text-teal-400 uppercase tracking-widest">Neon Voice Console</h1>

    <div class="terminal-box glow text-left">
      <p id="output" class="text-lg leading-relaxed typing">Press and hold the mic to begin...</p>
    </div>

    <div class="mt-10">
      <button id="micButton" class="mic-btn glow transition">
        🎤
      </button>
    </div>
  </div>

  <script>
    const micButton = document.getElementById("micButton");
    const output = document.getElementById("output");

    let recognition;
    let isListening = false;

    function updateText(text, animate = true) {
      output.classList.remove("typing");
      output.textContent = text;
      if (animate) output.classList.add("typing");
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        updateText("Listening...", true);
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        updateText(`🧠 You said: "${transcript}"`, false);
        if (transcript.includes("search")) {
          const query = transcript.split("search").pop().trim();
          if (query) {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
          } else {
            updateText("❗ Say 'search' followed by your query.");
          }
        }
      };

      recognition.onerror = (event) => {
        updateText(`⚠️ Error: ${event.error}`, false);
      };

      recognition.onend = () => {
        isListening = false;
        updateText("🎤 Press and hold the mic to begin...");
      };
    } else {
      updateText("❌ Speech recognition not supported in this browser.");
    }

    micButton.addEventListener("mousedown", () => {
      if (recognition && !isListening) {
        recognition.start();
        isListening = true;
      }
    });

    micButton.addEventListener("mouseup", () => {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }
    });

    micButton.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (recognition && !isListening) {
        recognition.start();
        isListening = true;
      }
    });

    micButton.addEventListener("touchend", () => {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }
    });
  </script>
</body>
</html>
