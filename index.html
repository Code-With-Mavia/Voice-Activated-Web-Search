<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Command Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f0f0f;
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid #2f2f2f;
      backdrop-filter: blur(10px);
    }
    .mic-btn {
      transition: background 0.2s ease;
    }
    .mic-btn:hover {
      background-color: #1e40af;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen text-gray-200">

  <main class="glass-panel w-full max-w-xl p-8 rounded-lg shadow-lg space-y-6">
    <h1 class="text-2xl font-semibold text-blue-400 border-b border-gray-700 pb-2">
      Voice Command Interface
    </h1>

    <div class="space-y-3">
      <p id="instruction" class="text-sm text-gray-400">
        Click the mic and say: <span class="text-blue-300">"Search Django tutorials"</span>
      </p>
      <div class="bg-gray-900 p-4 rounded text-sm text-gray-300 min-h-[3rem]" id="output">
        Awaiting input...
      </div>
    </div>

    <div class="flex justify-center">
      <button id="micBtn"
        class="mic-btn px-6 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700">
        Activate Mic
      </button>
    </div>
  </main>

  <script>
    const micBtn = document.getElementById('micBtn');
    const output = document.getElementById('output');
    const instruction = document.getElementById('instruction');

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        output.textContent = "Listening...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        output.textContent = `You said: "${transcript}"`;

        const lower = transcript.toLowerCase();
        if (lower.includes('search')) {
          const query = lower.replace('search', '').trim();
          if (query.length > 0) {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
          } else {
            output.textContent = 'Please say a query after "search".';
          }
        } else {
          output.textContent = 'Command not recognized. Try starting with "Search".';
        }
      };

      recognition.onerror = (event) => {
        output.textContent = `Error: ${event.error}`;
      };

      recognition.onend = () => {
        instruction.textContent = 'Click the mic and say: "Search Django tutorials"';
      };

      micBtn.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      output.textContent = "Your browser does not support Speech Recognition.";
      micBtn.disabled = true;
    }
  </script>
</body>
</html>
