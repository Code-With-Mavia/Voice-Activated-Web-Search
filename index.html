<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Search</title>
<style>
  :root {
    --bg-dark: #121212;
    --bg-light: #fefefe;
    --text-dark: #e0e0e0;
    --text-light: #222222;
    --accent: #1e90ff; /* Dodger Blue */
    --button-bg: var(--accent);
    --button-hover-bg: #1c7ed6;
  }

  /* Reset and base */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 3rem 2rem;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  body.light {
    background-color: var(--bg-light);
    color: var(--text-light);
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 1.5rem;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    user-select: none;
  }

  #status {
    font-size: 1.25rem;
    margin-bottom: 3rem;
    font-weight: 500;
    font-style: italic;
    max-width: 320px;
    text-align: center;
  }

  button#startBtn {
    background-color: var(--button-bg);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 1rem 2.5rem;
    cursor: pointer;
    box-shadow: 0 0 12px var(--accent);
    user-select: none;
    transition: background-color 0.3s ease, transform 0.15s ease;
  }

  button#startBtn:active {
    background-color: var(--button-hover-bg);
    transform: scale(0.95);
  }

  /* Toggle container fixed top-right */
  .toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    z-index: 1000;
  }

  /* Label text is NOT clickable */
  .toggle-container label {
    font-weight: 600;
    font-size: 1rem;
    color: inherit;
    pointer-events: none; /* Disable clicking on label */
    user-select: none;
  }

  /* Toggle switch */
  .toggle-switch {
    position: relative;
    width: 50px;
    height: 26px;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    background-color: #bbb;
    border-radius: 26px;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    transition: background-color 0.4s;
  }

  .slider::before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 2px;
    bottom: 2px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: transform 0.4s;
  }

  input:checked + .slider {
    background-color: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  input:checked + .slider::before {
    transform: translateX(24px);
  }
</style>
</head>
<body>
  <div class="toggle-container">
    <label id="modeLabel">Dark Mode</label>
    <div class="toggle-switch">
      <input type="checkbox" id="modeToggle" checked />
      <span class="slider"></span>
    </div>
  </div>

  <h1>Voice Search</h1>
  <div id="status">Press &amp; hold the button to speak</div>
  <button id="startBtn" aria-pressed="false" aria-label="Press and hold to speak">Hold to Speak</button>

<script>
  const modeToggle = document.getElementById('modeToggle');
  const modeLabel = document.getElementById('modeLabel');
  const body = document.body;
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  // Update mode label and body class on toggle
  function updateMode() {
    if (modeToggle.checked) {
      modeLabel.textContent = 'Dark Mode';
      body.classList.remove('light');
    } else {
      modeLabel.textContent = 'Light Mode';
      body.classList.add('light');
    }
  }

  modeToggle.addEventListener('change', updateMode);
  updateMode();

  // Speech recognition setup
  let recognition;
  let recognizing = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      status.textContent = 'Listening...';
      startBtn.setAttribute('aria-pressed', 'true');
    };

    recognition.onerror = (event) => {
      status.textContent = `Error: ${event.error}`;
      recognizing = false;
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onend = () => {
      recognizing = false;
      status.textContent = 'Press & hold the button to speak';
      startBtn.setAttribute('aria-pressed', 'false');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      status.textContent = `You said: "${transcript}"`;
      if (transcript.includes('search')) {
        const query = transcript.split('search').pop().trim();
        if (query) {
          const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          window.open(url, '_blank');
        } else {
          status.textContent = 'Say "search" followed by your query.';
        }
      } else {
        status.textContent = 'Say "search" followed by your query.';
      }
    };
  } else {
    status.textContent = 'Sorry, your browser does not support Speech Recognition.';
    startBtn.disabled = true;
  }

  // Button press & hold handlers
  startBtn.addEventListener('mousedown', () => {
    if (!recognizing) recognition.start();
  });

  startBtn.addEventListener('mouseup', () => {
    if (recognizing) recognition.stop();
  });

  startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!recognizing) recognition.start();
  }, { passive: false });

  startBtn.addEventListener('touchend', () => {
    if (recognizing) recognition.stop();
  });
</script>
</body>
</html>
