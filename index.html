<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Voice Console</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Fira Code', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .console-container {
      width: 90%;
      max-width: 720px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.7);
    }

    .console-header {
      font-size: 1rem;
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .output {
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 80px;
      white-space: pre-wrap;
      background: #0d1117;
      padding: 12px;
      border: 1px solid #21262d;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #2ea043;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="console-container">
    <div class="console-header">[ AI Voice Console ]</div>

    <div id="output" class="output">Awaiting voice command...</div>

    <button class="btn" id="startBtn">🎙 Start Listening</button>
    <div class="status-bar" id="status">Ready</div>
  </div>

  <script>
    const output = document.getElementById('output');
    const startBtn = document.getElementById('startBtn');
    const statusBar = document.getElementById('status');

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        statusBar.textContent = "Listening...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        output.textContent = `> ${transcript}`;

        const command = transcript.toLowerCase();
        if (command.startsWith("search")) {
          const query = command.replace("search", "").trim();
          if (query) {
            statusBar.textContent = `Opening Google for "${query}"...`;
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
          } else {
            statusBar.textContent = "No query found after 'search'.";
          }
        } else {
          statusBar.textContent = "Command not recognized. Try saying: 'Search Django'.";
        }
      };

      recognition.onerror = (event) => {
        statusBar.textContent = `Error: ${event.error}`;
      };

      recognition.onend = () => {
        statusBar.textContent = "Idle";
      };

      startBtn.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      output.textContent = "Voice recognition not supported in this browser.";
      startBtn.disabled = true;
    }
  </script>

</body>
</html>
