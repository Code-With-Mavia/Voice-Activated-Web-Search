<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucid Voice Search</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(to bottom, #0f1115, #1b1e24);
      font-family: 'Segoe UI', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mic-glow {
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.6);
    }

    .typing::after {
      content: '|';
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

  <div class="glass p-8 rounded-xl w-full max-w-md text-center space-y-6 shadow-xl">
    <h1 class="text-3xl font-bold text-cyan-300">Lucid Voice Search</h1>
    <p id="status" class="text-gray-400 typing">Tap mic and say something like “Search Python tutorials”</p>

    <button id="micBtn" class="w-16 h-16 rounded-full bg-cyan-400 text-white text-2xl mic-glow hover:scale-105 transition">🎤</button>
  </div>

  <script>
    const micBtn = document.getElementById("micBtn");
    const status = document.getElementById("status");
    let recognition;

    function update(text, typing = true) {
      status.classList.remove("typing");
      status.textContent = text;
      if (typing) status.classList.add("typing");
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => update("🎧 Listening...");
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        update(`🗣 You said: "${transcript}"`, false);

        if (transcript.includes("search")) {
          const query = transcript.replace("search", "").trim();
          if (query) {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
          } else {
            update("Say: 'Search' followed by your topic");
          }
        }
      };

      recognition.onerror = (e) => update("Error: " + e.error, false);
      recognition.onend = () => update("✅ Tap mic and say: 'Search X'", true);
    } else {
      update("❌ Speech recognition not supported", false);
    }

    micBtn.addEventListener("click", () => {
      if (recognition) recognition.start();
    });
  </script>
</body>
</html>
